[project]
name = "docflow-api"
version = "0.1.0"
description = "DocFlow HTTP API (FastAPI)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "docflow-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.17",
]

[tool.uv.sources]
docflow-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docflow_api"]
