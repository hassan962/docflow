[project]
name = "docflow-worker"
version = "0.1.0"
description = "DocFlow queue consumers: ocr, extract, validate, index."
requires-python = ">=3.12,<3.13"
dependencies = [
    "docflow-core",
]

[tool.uv.sources]
docflow-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docflow_worker"]
