server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 16m;  # uploads; the API enforces its own limit

    # Resolve "api" through Docker's DNS on each request (cached 10 s). A fixed
    # "proxy_pass http://api:8000" is resolved once at startup, so when the API container
    # is recreated with a new address nginx keeps the old one and answers 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /v1/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location = /healthz { proxy_pass $api; }

    location / {
        try_files $uri /index.html;
    }
}
