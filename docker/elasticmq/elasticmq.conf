# Local SQS (ElasticMQ). One queue per stage, each with its own dead-letter queue.
# maxReceiveCount = 3 must match MAX_RECEIVES in the app settings: after the third failed
# receive, the queue moves the message to the stage's -dlq queue.
# Visibility timeouts are longer than the slowest run of each stage, so a message is not
# redelivered while a worker is still on it.
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  docflow-ocr {
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "docflow-ocr-dlq", maxReceiveCount = 3 }
  }
  docflow-extract {
    defaultVisibilityTimeout = 180 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "docflow-extract-dlq", maxReceiveCount = 3 }
  }
  docflow-validate {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "docflow-validate-dlq", maxReceiveCount = 3 }
  }
  docflow-index {
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "docflow-index-dlq", maxReceiveCount = 3 }
  }
  docflow-ocr-dlq {}
  docflow-extract-dlq {}
  docflow-validate-dlq {}
  docflow-index-dlq {}
}
