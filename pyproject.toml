[project]
name = "docflow"
version = "0.1.0"
description = "Invoice and receipt extraction with human review, a gated learning loop and cited Q&A."
requires-python = ">=3.12,<3.13"
dependencies = [
    "docflow-core",
    "docflow-api",
    "docflow-worker",
]

[tool.uv.workspace]
members = ["packages/docflow_core", "apps/api", "apps/worker"]

[tool.uv.sources]
docflow-core = { workspace = true }
docflow-api = { workspace = true }
docflow-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    # synthetic invoice generator (scripts/generate_invoices.py)
    "faker>=33.0",
    "reportlab>=4.2",
]

[tool.pytest.ini_options]
testpaths = ["packages/docflow_core/tests", "apps/api/tests", "apps/worker/tests", "scripts/tests"]
pythonpath = [".", "scripts"]
addopts = "-ra --strict-markers"
markers = [
    "db: needs a running Postgres (docker compose up db); skipped when it is unreachable",
    "emulators: needs S3Mock and ElasticMQ (docker compose up s3mock elasticmq)",
    "llm: calls the real LLM provider; opt-in with RUN_LLM_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["docflow_core", "docflow_api", "docflow_worker", "generate_invoices", "conftest"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
