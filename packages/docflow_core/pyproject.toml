[project]
name = "docflow-core"
version = "0.1.0"
description = "Shared DocFlow core: schemas, OCR, extraction, validation, confidence, retrieval, eval, learning loop."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "python-dateutil>=2.9",
    "structlog>=24.4",
    "boto3>=1.35",
    "pillow>=11.0",
    "numpy>=2.1",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docflow_core"]
